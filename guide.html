<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#351f1c" />
    <meta name="description" content="《共赴》一生限定场智能引座官" />
    <title>智能引座官 ·《共赴》</title>
    <link rel="stylesheet" href="/src/guide.css" />
  </head>
  <body>
    <header class="guide-header">
      <a href="/" aria-label="返回请柬">‹</a>
      <div><span class="guide-status"></span><p>智能引座官</p><small>《共赴》一生限定场</small></div>
      <i>囍</i>
    </header>

    <main class="guide-main">
      <section class="guide-ticket">
        <span>特邀观众</span><b id="guideGuest">亲爱的宾客</b>
        <small id="guideTicket">嘉宾票 · 尚未取票</small>
      </section>

      <section class="chat" id="chat" aria-live="polite">
        <div class="message message--guide">
          <span class="message__avatar">囍</span>
          <p id="welcomeMessage">欢迎来到《共赴》一生限定场。我是今日引座官，可以帮您查询席位、节目单与场馆信息。</p>
        </div>
      </section>

      <section class="quick-actions" aria-label="快捷问题">
        <button type="button" data-question="我的座位在哪里">我的座位</button>
        <button type="button" data-question="介绍一下两位主角">认识主角</button>
        <button type="button" data-question="今天的节目流程">今日节目单</button>
        <button type="button" data-question="场馆在哪里">场馆信息</button>
        <button type="button" data-question="卫生间在哪里">卫生间</button>
        <button type="button" data-question="出口在哪里">出口指引</button>
      </section>
    </main>

    <form class="chat-input" id="chatForm">
      <input id="chatQuestion" aria-label="向引座官提问" placeholder="问问座位、流程或场馆信息…" autocomplete="off" />
      <button type="submit">发送</button>
    </form>
    <script type="module" src="/src/guide.js"></script>
  </body>
</html>
